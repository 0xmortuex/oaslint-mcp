[project]
name = "oaslint-mcp"
version = "0.1.0"
description = "MCP server that lints OpenAPI / Swagger specs and detects breaking changes between two versions of a spec, offline and read-only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "pyyaml>=6.0",
]
keywords = ["mcp", "openapi", "swagger", "breaking-changes", "lint", "api", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/0xmortuex/oaslint-mcp"

[project.scripts]
oaslint-mcp = "oaslint_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaslint_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
